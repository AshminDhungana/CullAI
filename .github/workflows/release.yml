name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # -----------------------------------------------------------------------
      # System-level libraw
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libraw
          echo "PKG_CONFIG_PATH=$(brew --prefix libraw)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix libraw)/lib $LDFLAGS" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix libraw)/include $CPPFLAGS" >> $GITHUB_ENV

      - name: Clean npm cache (Windows)
        if: runner.os == 'Windows'
        run: npm cache clean --force

      # -----------------------------------------------------------------------
      # Install JS deps
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Wipe any stale dist/ that may have been cached or left by a prior run.
      # This prevents tsc from reading a stale .tsbuildinfo and skipping emit,
      # which is what caused "dist/main/index.js was not found in this archive".
      # -----------------------------------------------------------------------
      - name: Clean dist
        run: npm run clean

      # -----------------------------------------------------------------------
      # Hard gate: confirm dist/ is truly gone before we start building.
      # If rimraf silently failed (e.g. file lock on Windows), catch it here
      # rather than letting tsc skip emit against a stale .tsbuildinfo.
      # -----------------------------------------------------------------------
      - name: Verify dist is clean
        shell: node {0}
        run: |
          const fs = require('fs');
          if (fs.existsSync('dist')) {
            console.error('dist/ still exists after clean — rimraf may have failed (file lock?)');
            process.exit(1);
          }
          console.log('dist/ confirmed absent — proceeding with fresh build');

      # -----------------------------------------------------------------------
      # Compile TypeScript — --force is set in package.json build:main so tsc
      # always emits even if .tsbuildinfo claims everything is up-to-date.
      # noEmitOnError: false in tsconfig.main.json ensures output is always
      # written even when type errors are present (they appear as warnings).
      # Icons are best-effort (files already committed to build/).
      # -----------------------------------------------------------------------
      - name: Build main (TypeScript)
        run: npm run build:main

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Build icons
        run: npm run build:icons
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Hard gate: fail immediately with a clear message if tsc produced no
      # output, rather than letting electron-builder create a broken .asar.
      # Also checks file size — a 0-byte file means tsc ran but emitted nothing.
      # -----------------------------------------------------------------------
      - name: Verify build output
        shell: node {0}
        run: |
          const fs = require('fs');
          const required = ['dist/main/index.js', 'dist/renderer/index.html'];
          for (const f of required) {
            if (!fs.existsSync(f)) {
              console.error(`MISSING: ${f} — did the build step silently fail?`);
              process.exit(1);
            }
            const size = fs.statSync(f).size;
            if (size === 0) {
              console.error(`EMPTY FILE: ${f} (0 bytes) — tsc emitted an empty file, check for compilation errors`);
              process.exit(1);
            }
            console.log(`OK: ${f} (${size} bytes)`);
          }
          console.log('Build output verified OK');

      # -----------------------------------------------------------------------
      # Publish
      # -----------------------------------------------------------------------
      - name: Publish release
        run: npx electron-builder --config electron-builder.yml --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS code signing (optional) ---
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # --- Windows code signing (optional) ---
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}