name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # -----------------------------------------------------------------------
      # System-level libraw
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libraw
          echo "PKG_CONFIG_PATH=$(brew --prefix libraw)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix libraw)/lib $LDFLAGS" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix libraw)/include $CPPFLAGS" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # Install JS deps
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Compile TypeScript — must succeed before electron-builder runs.
      # Icons are best-effort (files already committed to build/).
      # -----------------------------------------------------------------------
      - name: Build main (TypeScript)
        run: npm run build:main

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Build icons
        run: npm run build:icons
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Publish
      # -----------------------------------------------------------------------
      - name: Publish release
        run: npx electron-builder --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS code signing (optional) ---
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # --- Windows code signing (optional) ---
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}