name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libraw-dev

      # NPM_CONFIG_ignore_scripts prevents postinstall from running electron-rebuild
      # during `npm ci` — the test job doesn't need a packaged Electron binary.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_ignore_scripts: "true"

      - name: Run tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # -----------------------------------------------------------------------
      # System-level libraw (required to compile the lightdrift-libraw addon)
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libraw
          # Expose pkg-config path for both Intel (/usr/local) and Apple Silicon (/opt/homebrew)
          echo "PKG_CONFIG_PATH=$(brew --prefix libraw)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix libraw)/lib $LDFLAGS" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix libraw)/include $CPPFLAGS" >> $GITHUB_ENV

      # Windows ships a prebuilt .node via node-pre-gyp / package-lock; no
      # extra system lib is needed.  If a future version requires it, add a
      # vcpkg or chocolatey step here.

      # -----------------------------------------------------------------------
      # Install JS deps (postinstall runs electron-rebuild automatically)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Wipe any stale dist/ that may have been cached or left by a prior run.
      # This prevents tsc from reading a stale .tsbuildinfo and skipping emit,
      # which is what caused "dist/main/index.js was not found in this archive".
      # -----------------------------------------------------------------------
      - name: Clean dist
        run: npm run clean

      # -----------------------------------------------------------------------
      # Hard gate: confirm dist/ is truly gone before we start building.
      # If rimraf silently failed (e.g. file lock on Windows), catch it here
      # rather than letting tsc skip emit against a stale .tsbuildinfo.
      # -----------------------------------------------------------------------
      - name: Verify dist is clean
        shell: node {0}
        run: |
          const fs = require('fs');
          if (fs.existsSync('dist')) {
            console.error('dist/ still exists after clean — rimraf may have failed (file lock?)');
            process.exit(1);
          }
          console.log('dist/ confirmed absent — proceeding with fresh build');

      # -----------------------------------------------------------------------
      # Compile TypeScript — --force is set in package.json build:main so tsc
      # always emits even if .tsbuildinfo claims everything is up-to-date.
      # noEmitOnError: false in tsconfig.main.json ensures output is always
      # written even when type errors are present (they appear as warnings).
      # These two steps MUST succeed before electron-builder is invoked.
      # -----------------------------------------------------------------------
      - name: Build main (TypeScript)
        run: npm run build:main

      - name: Build renderer (Vite)
        run: npm run build:renderer

      # Icon generation uses a canvas/native dependency that can be flaky on
      # headless CI runners. The icon files are committed to build/ so this
      # step is best-effort — a failure here does not corrupt the asar.
      - name: Build icons
        run: npm run build:icons
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Hard gate: fail immediately with a clear message if tsc produced no
      # output, rather than letting electron-builder create a broken .asar.
      # Also checks file size — a 0-byte file means tsc ran but emitted nothing.
      # -----------------------------------------------------------------------
      - name: Verify build output
        shell: node {0}
        run: |
          const fs = require('fs');
          const required = ['dist/main/index.js', 'dist/renderer/index.html'];
          for (const f of required) {
            if (!fs.existsSync(f)) {
              console.error(`MISSING: ${f} — did the build step silently fail?`);
              process.exit(1);
            }
            const size = fs.statSync(f).size;
            if (size === 0) {
              console.error(`EMPTY FILE: ${f} (0 bytes) — tsc emitted an empty file, check for compilation errors`);
              process.exit(1);
            }
            console.log(`OK: ${f} (${size} bytes)`);
          }
          console.log('Build output verified OK');

      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------
      - name: Build distributable
        run: npx electron-builder --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cullai-${{ matrix.os }}
          path: release/**
          if-no-files-found: error