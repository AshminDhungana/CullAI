appId: app.cullai.desktop
productName: CullAI
copyright: Copyright © 2026 CullAI

directories:
  output: release
  buildResources: build

files:
  - from: dist
    to: dist
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.tsbuildinfo"
  - package.json

extraResources:
  - from: node_modules/@vladmandic/human/models
    to: models/human

asarUnpack:
  - "**/*.node"

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CullAI

portable:
  artifactName: CullAI-Portable-${version}.${ext}

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.photography
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: CullAI-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
# NOTE: `desktopName` and `syncDesktopName` are NOT valid keys under the
# `linux` block in electron-builder's config schema (this caused the
# "configuration.linux should be one of these: null" validation error).
# `desktopName` is already set at the package.json root level, so it's
# omitted here entirely rather than relocated, to avoid drift between
# the two config sources.
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Graphics;Photography
  maintainer: Ashmin Dhungana
  executableName: CullAI

# ---------------------------------------------------------------------------
# Auto-update publishing
# ---------------------------------------------------------------------------
publish:
  - provider: github
    owner: AshminDhungana
    repo: CullAI
    releaseType: release
